name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the zip to releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Build separately: dotnet test passes unknown options like -clp on to the test app, which then fails to start
      - name: Build tests
        run: dotnet build CP2077SaveEditor.Tests/CP2077SaveEditor.Tests.csproj -p:Platform=x64 -clp:ErrorsOnly

      # The round-trip tests need a real save (CP2077_TEST_SAVE), so here they are skipped and only prove the build works
      - name: Test
        run: dotnet test --project CP2077SaveEditor.Tests/CP2077SaveEditor.Tests.csproj -p:Platform=x64 --no-build

      # Only errors in the log: the WolvenKit submodule alone produces hundreds of warnings.
      # No .pdb (WolvenKit's alone is 76 MB) and no translations of .NET's own messages.
      - name: Publish (needs .NET 10)
        run: dotnet publish CP2077SaveEditor/CP2077SaveEditor.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained false -p:DebugType=none -p:SatelliteResourceLanguages=en -o publish -clp:ErrorsOnly

      # A single exe with .NET inside, for players without the .NET 10 Desktop Runtime
      - name: Publish (standalone)
        run: dotnet publish CP2077SaveEditor/CP2077SaveEditor.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:SatelliteResourceLanguages=en -o publish-standalone -clp:ErrorsOnly

      # The artifact download is zipped by GitHub already, so upload the folders as they are
      - uses: actions/upload-artifact@v7
        with:
          name: CyberCAT-Reloaded
          path: publish/

      # Only the exe: the other files are WolvenKit's native libraries for Linux/macOS
      - uses: actions/upload-artifact@v7
        with:
          name: CyberCAT-Reloaded-Standalone
          path: publish-standalone/CP2077SaveEditor.exe

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath CyberCAT-Reloaded.zip
          Compress-Archive -Path publish-standalone/CP2077SaveEditor.exe -DestinationPath CyberCAT-Reloaded-Standalone.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CyberCAT-Reloaded.zip
            CyberCAT-Reloaded-Standalone.zip
          generate_release_notes: true

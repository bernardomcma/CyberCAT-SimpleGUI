name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the zip to releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish CP2077SaveEditor/CP2077SaveEditor.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained false -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath CP2077SaveEditor.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CP2077SaveEditor
          path: CP2077SaveEditor.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CP2077SaveEditor.zip
          generate_release_notes: true
